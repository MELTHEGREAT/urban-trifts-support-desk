<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urban Trifts Support Desk</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo" data-shoe></span><span class="brand-name">Urban Trifts</span></div>
    <button class="newchat" id="newChat" type="button">+ New chat</button>
    <div class="side-label">Try asking</div>
    <button class="prompt" type="button" data-p="My order hasn't arrived yet. What should I do?">Where is my order?</button>
    <button class="prompt" type="button" data-p="How do I start a return for something I bought?">Start a return</button>
    <button class="prompt" type="button" data-p="I received the wrong size. Can you help me fix it?">Wrong size received</button>
    <div class="side-foot">Support Assistant<br><span>Runs privately with Ollama</span></div>
  </aside>

  <main class="main">
    <header class="top">
      <div class="top-brand"><span class="logo small" data-shoe></span><span class="brand-name">Urban Trifts</span></div>
      <div class="top-title">Support Assistant</div>
      <button class="newchat-mobile" id="newChatMobile" type="button">New chat</button>
    </header>

    <div class="notice" id="notice" role="alert" hidden></div>

    <div class="scroll" id="scroll">
      <div class="thread" id="thread" aria-live="polite">
        <div class="welcome" id="welcome">
          <span class="logo big" data-shoe></span>
          <h1>How can I help you today?</h1>
          <div class="chips">
            <button class="chip" type="button" data-p="My order hasn't arrived yet. What should I do?">Track a late order</button>
            <button class="chip" type="button" data-p="How do I start a return for something I bought?">Start a return</button>
            <button class="chip" type="button" data-p="I received the wrong size. Can you help me fix it?">Fix a wrong size</button>
            <button class="chip" type="button" data-p="Can you explain how you can help me?">What can you do?</button>
          </div>
        </div>
      </div>
    </div>

    <form class="composer" id="form" autocomplete="off">
      <div class="box">
        <textarea id="input" rows="1" maxlength="4000" placeholder="Message Urban Trifts Support" aria-label="Message"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <p class="fine">AI can make mistakes. For orders, returns and refunds, a teammate will confirm the details.</p>
    </form>
  </main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
